<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phục thù Lộc Trap Boy - Caro Online</title>
<style>
    body{
        font-family: Arial, sans-serif;
        text-align:center;
        background:#0f172a;
        color:white;
        margin:0;
        padding:20px;
    }
    h1{ margin:15px 0; color:#38bdf8; }
    #status{ margin:10px; font-size:20px; font-weight:bold; color:#38bdf8; }
    .board{
        display:grid;
        grid-template-columns:repeat(15,38px);
        justify-content:center;
        gap:2px;
        margin:20px auto;
        background:#1e293b;
        padding:8px;
        border-radius:8px;
    }
    .cell{
        width:38px; height:38px;
        background:#1e293b;
        border:1px solid #475569;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:26px;
        font-weight:bold;
        cursor:pointer;
        user-select:none;
        border-radius:3px;
    }
    .cell:hover{ background:#334155; }
    .x{ color:#ef4444; }
    .o{ color:#22c55e; }
    button{
        padding:10px 18px;
        margin:5px;
        border:none;
        border-radius:6px;
        cursor:pointer;
        font-size:16px;
    }
    .btn-create{ background:#22c55e; color:black; }
    .btn-join{ background:#38bdf8; color:black; }
    input{
        padding:10px;
        font-size:16px;
        width:200px;
        border-radius:6px;
        border:none;
    }
    #roomInfo{ margin:15px 0; font-size:18px; color:#fbbf24; }
    #errorMsg { color: #ef4444; margin:10px; }
</style>
</head>
<body>
    <h1>🔥 Phục thù Lộc Trap Boy</h1>
   
    <div>
        <button class="btn-create" onclick="createRoom()">Tạo Phòng Mới</button>
        <input id="roomInput" placeholder="Nhập mã phòng" maxlength="20">
        <button class="btn-join" onclick="joinRoom()">Vào Phòng</button>
    </div>
    <div id="roomInfo"></div>
    <div id="errorMsg"></div>
    <div id="status">Nhấn "Tạo Phòng Mới" để bắt đầu...</div>
    <div class="board" id="board"></div>
   
    <button onclick="resetGame()" style="background:#ef4444;color:white;margin-top:10px;">Chơi Lại</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCUv0qZpPpmgDCg9z86EFji72IG_gRNwo",
        authDomain: "carofunny-a6707.firebaseapp.com",
        databaseURL: "https://carofunny-a6707-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "carofunny-a6707",
        storageBucket: "carofunny-a6707.firebasestorage.app",
        messagingSenderId: "263175159439",
        appId: "1:263175159439:web:8151cb4b7318e7b84f3afa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const SIZE = 15;
    let board = [];
    let currentPlayer = "X";
    let gameOver = false;
    let roomId = null;
    let playerRole = null;
    let isHost = false;
    let secretMode = false;
    let xMovesLeft = 1;

    const boardDiv = document.getElementById("board");
    const statusDiv = document.getElementById("status");
    const roomInfo = document.getElementById("roomInfo");
    const errorMsg = document.getElementById("errorMsg");

    function createBoardUI() {
        boardDiv.innerHTML = "";
        board = Array.from({length: SIZE}, () => Array(SIZE).fill(""));
        for(let r = 0; r < SIZE; r++) {
            for(let c = 0; c < SIZE; c++) {
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.dataset.r = r;
                cell.dataset.c = c;
                cell.onclick = handleClick;
                boardDiv.appendChild(cell);
            }
        }
    }

    function renderBoard() {
        document.querySelectorAll('.cell').forEach(cell => {
            const r = +cell.dataset.r, c = +cell.dataset.c;
            const val = board[r][c];
            cell.textContent = val;
            cell.classList.remove('x','o');
            if(val) cell.classList.add(val.toLowerCase());
        });
    }

    window.createRoom = async () => {
        errorMsg.textContent = "";
        try {
            roomId = push(ref(db, 'rooms')).key;
            isHost = true;
            playerRole = "X";
            secretMode = false;
            xMovesLeft = 1;

            await set(ref(db, 'rooms/' + roomId), {
                board: Array.from({length: SIZE}, () => Array(SIZE).fill("")),
                currentPlayer: "X",
                gameOver: false,
                secretMode: false,
                createdAt: Date.now()
            });

            roomInfo.innerHTML = `✅ Mã phòng: <b>${roomId}</b><br>Gửi cho bạn bè`;
            statusDiv.textContent = "Bạn là X - Đang chờ đối thủ...";
            createBoardUI();
            listenToRoom();
        } catch(e) {
            errorMsg.textContent = "❌ Lỗi tạo phòng: " + e.message;
        }
    };

    window.joinRoom = () => {
        errorMsg.textContent = "";
        roomId = document.getElementById("roomInput").value.trim();
        if (!roomId) return alert("Vui lòng nhập mã phòng!");
        createBoardUI();
        listenToRoom();
    };

    function listenToRoom() {
        const roomRef = ref(db, 'rooms/' + roomId);
       
        onValue(roomRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                errorMsg.textContent = "Phòng không tồn tại hoặc đã bị xóa!";
                return;
            }

            board = data.board || Array.from({length: SIZE}, () => Array(SIZE).fill(""));
            currentPlayer = data.currentPlayer;
            gameOver = data.gameOver || false;
            secretMode = !!data.secretMode;

            renderBoard();

            // Gán role cho người chơi thứ 2
            if (!playerRole) {
                playerRole = currentPlayer === "X" ? "O" : "X";
            }

            if (gameOver) {
                statusDiv.textContent = `🎉 ${currentPlayer} thắng!`;
            } else {
                const isMyTurn = currentPlayer === playerRole;
                
                if (isMyTurn && currentPlayer === "X") {
                    xMovesLeft = secretMode ? 2 : 1;
                }

                statusDiv.textContent = isMyTurn
                    ? `Đến lượt bạn (${currentPlayer})${secretMode && currentPlayer==='X' ? ' (2 nước)' : ''}`
                    : `Lượt của ${currentPlayer}`;
            }
        });
    }

    function handleClick(e) {
        if (!roomId || gameOver || currentPlayer !== playerRole) return;
       
        const r = +e.target.dataset.r;
        const c = +e.target.dataset.c;
        if (board[r][c] !== "") return;

        board[r][c] = currentPlayer;
        e.target.textContent = currentPlayer;
        e.target.classList.add(currentPlayer.toLowerCase());

        const roomRef = ref(db, 'rooms/' + roomId);

        if (checkWin(r, c, currentPlayer)) {
            set(roomRef, { 
                board, 
                currentPlayer, 
                gameOver: true,
                secretMode 
            });
            return;
        }

        // Xử lý Secret Mode cho X
        if (currentPlayer === "X" && secretMode) {
            xMovesLeft--;
            if (xMovesLeft > 0) {
                statusDiv.textContent = `Đến lượt bạn (X) - Còn ${xMovesLeft} nước`;
                set(roomRef, { 
                    board, 
                    currentPlayer: "X", 
                    gameOver: false,
                    secretMode 
                });
                return;
            }
        }

        // Đổi lượt
        const nextPlayer = currentPlayer === "X" ? "O" : "X";
        xMovesLeft = (secretMode && nextPlayer === "X") ? 2 : 1;

        set(roomRef, {
            board,
            currentPlayer: nextPlayer,
            gameOver: false,
            secretMode
        });
    }

    function checkWin(r, c, p) {
        const dirs = [[1,0],[0,1],[1,1],[1,-1]];
        for (let [dr, dc] of dirs) {
            let count = 1;
            let i = r + dr, j = c + dc;
            while (i>=0 && i<SIZE && j>=0 && j<SIZE && board[i][j]===p) { count++; i+=dr; j+=dc; }
            i = r - dr; j = c - dc;
            while (i>=0 && i<SIZE && j>=0 && j<SIZE && board[i][j]===p) { count++; i-=dr; j-=dc; }
            if (count >= 5) return true;
        }
        return false;
    }

    window.resetGame = () => {
        if (!roomId || !isHost) return alert("Chỉ người tạo phòng được reset!");
        
        set(ref(db, 'rooms/' + roomId), {
            board: Array.from({length: SIZE}, () => Array(SIZE).fill("")),
            currentPlayer: "X",
            gameOver: false,
            secretMode: secretMode
        });
    };

    // 🔥 Secret Mode - Ctrl + H (Chỉ Host)
    document.addEventListener("keydown", async (e) => {
        if (e.ctrlKey && e.key.toLowerCase() === "h") {
            if (!roomId || !isHost) {
                alert("Chỉ người tạo phòng mới được bật/tắt Secret Mode!");
                return;
            }
            secretMode = !secretMode;
            
            await set(ref(db, 'rooms/' + roomId + '/secretMode'), secretMode);
            
            alert(secretMode ? "🔥 SECRET MODE ON\nX được đánh 2 nước mỗi lượt!" : "❌ Secret Mode OFF");
        }
    });
</script>
</body>
</html>
