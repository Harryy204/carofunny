<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phục thù Lộc Trap Boy - Caro Online</title>
<style>
    body{
        font-family: Arial, sans-serif;
        text-align:center;
        background:#0f172a;
        color:white;
        margin:0;
        padding:20px;
    }
    h1{
        margin:15px 0;
        color:#38bdf8;
    }
    #status{
        margin:10px;
        font-size:20px;
        font-weight:bold;
        color:#38bdf8;
    }
    .board{
        display:grid;
        grid-template-columns:repeat(15,38px);
        justify-content:center;
        gap:2px;
        margin:20px auto;
        background:#1e293b;
        padding:8px;
        border-radius:8px;
    }
    .cell{
        width:38px;
        height:38px;
        background:#1e293b;
        border:1px solid #475569;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:26px;
        font-weight:bold;
        cursor:pointer;
        user-select:none;
        border-radius:3px;
    }
    .cell:hover{ background:#334155; }
    .x{ color:#ef4444; }
    .o{ color:#22c55e; }

    .controls{
        margin:15px 0;
    }
    button{
        padding:10px 16px;
        margin:5px;
        border:none;
        border-radius:6px;
        cursor:pointer;
        font-size:16px;
    }
    .btn-create{ background:#22c55e; color:black; }
    .btn-join{ background:#38bdf8; color:black; }
    input{
        padding:10px;
        font-size:16px;
        width:180px;
        border-radius:6px;
        border:none;
    }
    #roomInfo{
        margin-top:10px;
        font-size:18px;
        color:#fbbf24;
    }
</style>
</head>
<body>
    <h1>🔥 Phục thù Lộc Trap Boy</h1>
    
    <div class="controls">
        <button class="btn-create" onclick="createRoom()">Tạo Phòng Mới</button>
        <input id="roomInput" placeholder="Nhập mã phòng" maxlength="20">
        <button class="btn-join" onclick="joinRoom()">Vào Phòng</button>
    </div>

    <div id="roomInfo"></div>
    <div id="status">Chờ tạo/vào phòng...</div>
    <div class="board" id="board"></div>
    
    <button onclick="resetGame()" style="background:#ef4444;color:white;">Chơi Lại</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCUv0qZpPpmgDCg9z86EFji72IG_gRNwo",
        authDomain: "carofunny-a6707.firebaseapp.com",
        databaseURL: "https://carofunny-a6707-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "carofunny-a6707",
        storageBucket: "carofunny-a6707.firebasestorage.app",
        messagingSenderId: "263175159439",
        appId: "1:263175159439:web:8151cb4b7318e7b84f3afa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const SIZE = 15;
    let board = [];
    let currentPlayer = "X";
    let gameOver = false;
    let roomId = null;
    let playerRole = null;
    let isHost = false;

    const boardDiv = document.getElementById("board");
    const statusDiv = document.getElementById("status");
    const roomInfo = document.getElementById("roomInfo");

    function createBoardUI() {
        boardDiv.innerHTML = "";
        board = Array(SIZE).fill().map(() => Array(SIZE).fill(""));
        
        for(let r = 0; r < SIZE; r++) {
            for(let c = 0; c < SIZE; c++) {
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.dataset.r = r;
                cell.dataset.c = c;
                cell.onclick = handleClick;
                boardDiv.appendChild(cell);
            }
        }
    }

    function renderBoard() {
        const cells = document.querySelectorAll('.cell');
        cells.forEach(cell => {
            const r = +cell.dataset.r;
            const c = +cell.dataset.c;
            const val = board[r][c];
            cell.textContent = val;
            cell.classList.remove('x', 'o');
            if (val) cell.classList.add(val.toLowerCase());
        });
    }

    async function createRoom() {
        roomId = push(ref(db, 'rooms')).key;
        isHost = true;
        playerRole = "X";

        await set(ref(db, 'rooms/' + roomId), {
            board: Array(SIZE).fill().map(() => Array(SIZE).fill("")),
            currentPlayer: "X",
            gameOver: false,
            players: { "X": true }
        });

        roomInfo.innerHTML = `📌 Mã phòng: <b>${roomId}</b><br>Chia sẻ cho bạn bè`;
        statusDiv.textContent = "Lượt của X (Bạn là X)";
        createBoardUI();
        listenToRoom();
    }

    function joinRoom() {
        roomId = document.getElementById("roomInput").value.trim();
        if (!roomId) return alert("Vui lòng nhập mã phòng!");

        const roomRef = ref(db, 'rooms/' + roomId);
        
        onValue(roomRef, (snapshot) => {
            if (!snapshot.exists()) {
                alert("Phòng không tồn tại hoặc đã bị xóa!");
                return;
            }
            
            if (!playerRole) {
                playerRole = "O";
                set(ref(db, 'rooms/' + roomId + '/players/O'), true);
                statusDiv.textContent = "Bạn là O";
            }
        }, { onlyOnce: true });

        createBoardUI();
        listenToRoom();
    }

    function listenToRoom() {
        const roomRef = ref(db, 'rooms/' + roomId);
        
        onValue(roomRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            board = data.board || Array(SIZE).fill().map(() => Array(SIZE).fill(""));
            currentPlayer = data.currentPlayer;
            gameOver = data.gameOver || false;

            renderBoard();

            if (gameOver) {
                statusDiv.textContent = `🎉 ${currentPlayer} thắng!`;
            } else {
                statusDiv.textContent = currentPlayer === playerRole 
                    ? `Đến lượt bạn (${currentPlayer})` 
                    : `Lượt của ${currentPlayer}`;
            }
        });
    }

    function handleClick(e) {
        if (!roomId || gameOver || currentPlayer !== playerRole) return;
        
        const r = +e.target.dataset.r;
        const c = +e.target.dataset.c;
        if (board[r][c] !== "") return;

        board[r][c] = currentPlayer;
        e.target.textContent = currentPlayer;
        e.target.classList.add(currentPlayer.toLowerCase());

        const roomRef = ref(db, 'rooms/' + roomId);

        if (checkWin(r, c, currentPlayer)) {
            set(roomRef, { board, currentPlayer, gameOver: true });
            return;
        }

        const nextPlayer = currentPlayer === "X" ? "O" : "X";
        set(roomRef, { board, currentPlayer: nextPlayer, gameOver: false });
    }

    function checkWin(r, c, p) {
        const dirs = [[1,0],[0,1],[1,1],[1,-1]];
        for (let [dr, dc] of dirs) {
            let count = 1;
            
            // Kiểm tra một hướng
            let i = r + dr, j = c + dc;
            while (i >= 0 && i < SIZE && j >= 0 && j < SIZE && board[i][j] === p) {
                count++; i += dr; j += dc;
            }
            
            // Kiểm tra hướng ngược lại
            i = r - dr; j = c - dc;
            while (i >= 0 && i < SIZE && j >= 0 && j < SIZE && board[i][j] === p) {
                count++; i -= dr; j -= dc;
            }
            
            if (count >= 5) return true;
        }
        return false;
    }

    window.resetGame = function() {
        if (!roomId || !isHost) {
            return alert("Chỉ người tạo phòng mới được reset!");
        }
        set(ref(db, 'rooms/' + roomId), {
            board: Array(SIZE).fill().map(() => Array(SIZE).fill("")),
            currentPlayer: "X",
            gameOver: false,
            players: { "X": true }
        });
    };

    // Ctrl + H để bật secret mode (2 nước X)
    let secretMode = false;
    document.addEventListener("keydown", (e) => {
        if (e.ctrlKey && e.key.toLowerCase() === "h") {
            secretMode = !secretMode;
            alert(secretMode ? "🔥 Secret Mode ON (X chơi 2 nước)" : "Secret Mode OFF");
        }
    });
</script>
</body>
</html>
